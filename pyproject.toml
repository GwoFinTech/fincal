[project]
name = "fincal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg2-binary>=2.9",
    "cachetools>=5.3",
    "futu-api>=10.6.6608",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Test-only: the reference iCal parser the RFC 5545 / zh-feed checks use
    # (tests/test_ical_rfc5545.py, tests/test_issue97_zh_description.py). It was
    # installed ad hoc in one venv, so a fresh clone could not even collect the
    # suite (Issue #98).
    "icalendar>=6",
    # Test-only: `starlette.testclient` (used by the endpoint tests) refuses to
    # import without httpx2; it was likewise present only by accident in the
    # developer venv, so `uv sync` on a fresh clone collected nothing.
    "httpx2>=2",
]

[tool.pytest.ini_options]
markers = [
    "integration: exercises the real PostgreSQL instance; omitted from the default run, opt in with --run-integration (Issue #98)",
]
